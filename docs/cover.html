<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Takeoff cover</title>
  <style>
    @font-face {
      font-family: Space;
      src: url(space-grotesk.ttf);
      font-weight: 300 700;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1280px;
      height: 640px;
      background: #f4f2eb;
      color: #282a25;
      font-family: Space, sans-serif;
      padding: 48px 64px;
    }
    .brand {
      font-size: 28px;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 32px;
      align-items: center;
    }
    h1 {
      font-size: 74px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.07;
      margin: 64px 0 24px;
    }
    p {
      font-size: 23px;
      line-height: 1.5;
      color: #5e6058;
      margin: 0;
      max-width: 550px;
    }
    img {
      mix-blend-mode: darken;
      width: 100%;
    }
    footer {
      margin-top: 48px;
      color: #5e6058;
      font-size: 16px;
    }
  </style>
  <div class="brand">Takeoff</div>
  <div class="layout">
    <div>
      <h1>Find the weak spots<br />before you ship.</h1>
      <p>A repeatable release review<br />for your coding agent.</p>
    </div>
    <img src="icon.png" alt="Folded paper glider" />
  </div>
  <footer>Open source. Read the prompt. Challenge the checks.</footer>
</html>
